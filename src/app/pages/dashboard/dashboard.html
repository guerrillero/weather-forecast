<main class="relative w-full background font-brand text-primary">
    <div class="frames"></div>
    <div class="radar"></div>
    <div class="mx-auto max-w-7xl p-4 sm:p-6 lg:p-8 flex flex-col gap-y-8">
        <app-top></app-top>
        <app-header [data]="processWeather().header"></app-header>
        <app-current-weather [current]="processWeather().currentPeriod"></app-current-weather>
        <app-graphic [graphic]="processWeather().graphic"></app-graphic>
        <app-periods [periods]="processWeather().periods"></app-periods>
    </div>
</main>
