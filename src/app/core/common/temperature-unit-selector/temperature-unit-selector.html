<div class="flex items-center justify-end gap-1">
    <div class="text-sm">
        <label id="celcius" class="font-medium text-gray-100 dark:text-white">°C</label>
    </div>
    <div
        class="group relative inline-flex h-5 w-10 shrink-0 items-center justify-center rounded-full outline-offset-2 outline-cyan-600 has-focus-visible:outline-2 dark:outline-cyan-500">
        <span
            class="absolute mx-auto h-4 w-9 rounded-full bg-gray-200 inset-ring inset-ring-gray-900/5 transition-colors duration-200 ease-in-out group-has-checked:bg-cyan-600 dark:bg-gray-800/50 dark:inset-ring-white/10 dark:group-has-checked:bg-cyan-500"></span>
        <span
            class="absolute left-0 size-5 rounded-full border border-gray-300 bg-white shadow-xs transition-transform duration-200 ease-in-out group-has-checked:translate-x-5 dark:shadow-none"></span>
        <input type="checkbox" name="setting" aria-label="Use setting" [checked]="temperatureChecked()"
            (change)="temperatureUnit.toggle()"
            class="absolute inset-0 size-full appearance-none focus:outline-hidden" />
    </div>
    <div class="text-sm">
        <label id="fahrenheit" class="font-medium text-gray-100 dark:text-white">°F</label>
    </div>
</div>
