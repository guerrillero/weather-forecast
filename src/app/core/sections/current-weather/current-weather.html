@let period = current();
<div class="pt-3 flex items-start gap-6 text-wrap">
  <div class="flex items-start">
    <div class="temperature">
      {{ period.temperature }}
    </div>
    <div class="temperature__unit">°{{ period.temperatureUnit }}</div>
  </div>
  <div class="flex flex-col gap-2 pt-2">
    <div class="text-sky-100 text-md">
      {{ period.shortForecast }}
    </div>
    <div class="flex flex-col gap-1 font-sans text-sm space-x-0.5">
      <span class="text-gray-400">H {{ period.windSpeed }} · {{ period.windDirection }}</span>
      <span class="text-primary">{{ period.name }}</span>
    </div>
  </div>
</div>
