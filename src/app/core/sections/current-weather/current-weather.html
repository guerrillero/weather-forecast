@let period = current();
<div class="relative pt-3 flex flex-col sm:flex-row items-start gap-6 text-wrap">
    <img [src]="period.icon" [alt]="period.shortForecast" class=" top-0 left-0 size-fit sm:size-28" />
  <div class="flex items-start">
    <div class="temperature">
      {{ period.temperature | toCelcius:1 }}
    </div>
    <div class="temperature__unit">°C</div>
  </div>
  <div class="flex flex-col gap-2 pt-2">
    <div class="text-sky-100 text-md">
      {{ period.shortForecast }}
    </div>
    <div class="flex flex-col gap-1 font-sans text-sm space-x-0.5">
      <span class="text-gray-400">H {{ period.windSpeed }} · {{ period.windDirection }}</span>
      <span class="text-primary">{{ period.name }}</span>
    </div>
  </div>
</div>
